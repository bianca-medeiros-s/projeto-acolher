
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Cadastre-se para participar das ações do Projeto Acolher."
    >

    <title>Cadastro | Projeto Acolher</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <header>

        <div class="logo-area">

            <a
                href="index.html"
                aria-label="Página inicial do Projeto Acolher"
            >

                <img
                    src="../imagens/logo.png"
                    alt="Logo do Projeto Acolher"
                >

            </a>

            <h1>
                Projeto Acolher
            </h1>

        </div>


        <input
            type="checkbox"
            id="menu-toggle"
            class="menu-toggle"
        >


        <label
            for="menu-toggle"
            class="menu-icon"
            aria-label="Abrir menu"
        >
            ☰
        </label>


        <nav aria-label="Navegação principal">

            <ul>

                <li>
                    <a href="index.html">
                        Início
                    </a>
                </li>

                <li>
                    <a href="projetos.html">
                        Projetos
                    </a>
                </li>

                <li>
                    <a href="cadastro.html">
                        Cadastro
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>


        <section class="pagina-cabecalho">

            <span class="tag">
                Participe
            </span>

            <h2>
                Cadastro de voluntários
            </h2>

            <p>
                Preencha seus dados para demonstrar interesse
                em participar do Projeto Acolher.
            </p>

        </section>


        <section class="formulario-area">

            <form id="form-cadastro">


                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="Digite seu telefone"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="interesse">
                        Área de interesse
                    </label>

                    <select
                        id="interesse"
                        name="interesse"
                        required
                    >

                        <option value="">
                            Selecione uma opção
                        </option>

                        <option value="voluntariado">
                            Voluntariado
                        </option>

                        <option value="doacoes">
                            Doações
                        </option>

                        <option value="projetos">
                            Projetos sociais
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="mensagem">
                        Mensagem
                    </label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="5"
                        placeholder="Conte um pouco sobre como deseja participar"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Enviar cadastro
                </button>


            </form>

        </section>


    </main>


    <footer>

        <p>
            &copy; 2026 Projeto Acolher.
            Todos os direitos reservados.
        </p>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>


    <script>

        const formulario =
            document.querySelector("#form-cadastro");


        formulario.addEventListener(
            "submit",
            function (evento) {

                evento.preventDefault();


                const nome =
                    document
                        .querySelector("#nome")
                        .value
                        .trim();


                if (
                    typeof Swal !== "undefined"
                ) {

                    Swal.fire({

                        title: "Cadastro enviado!",

                        text:
                            `Obrigado, ${nome}! Seu interesse em participar foi registrado.`,

                        icon: "success",

                        confirmButtonText: "Continuar"

                    });

                } else {

                    alert(
                        `Obrigado, ${nome}! Seu cadastro foi enviado.`
                    );

                }


                formulario.reset();

            }
        );

    </script>

</body>

</html>
